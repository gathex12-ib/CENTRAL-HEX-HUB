<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d19"><title>Administration — CENTRAL-HEX HUB</title><link rel="icon" href="../assets/central-hex-icon.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="admin.css"></head><body class="dark"><header class="site-header"><a class="brand" href="/"><img src="../assets/central-hex-icon.png" class="brand-icon" alt=""><span>CENTRAL-HEX <small>ADMIN</small></span></a><a class="btn btn-ghost" href="/">← Voir le site</a></header><main class="admin-page wrap"><section id="loginPanel" class="admin-login"><span class="kicker">ZONE PRIVÉE</span><h1>Administration <em>CENTRAL-HEX</em></h1><p>Connecte-toi avec le mot de passe administrateur configuré dans les variables d’environnement Netlify.</p><form id="loginForm"><label>Mot de passe administrateur<input type="password" name="password" required autocomplete="current-password"></label><button class="btn btn-blue" type="submit">Se connecter ↗</button><p id="loginStatus" role="status"></p></form></section><section id="dashboard" class="hidden"><div class="admin-heading"><div><span class="kicker">TABLEAU DE BORD</span><h1>Gestion du <em>HUB.</em></h1></div><button id="logout" class="btn btn-ghost">Déconnexion</button></div><div class="admin-tabs"><button class="active" data-tab="projects">Projets</button><button data-tab="proposals">Propositions reçues <span id="proposalCount">0</span></button></div><section id="projectsTab"><div class="admin-toolbar"><p id="projectCount">Catalogue</p><div><button id="addProject" class="btn btn-blue">＋ Ajouter un projet</button><button id="exportProjects" class="btn btn-ghost">Exporter JSON</button></div></div><div id="adminProjects" class="admin-projects"></div><form id="projectEditor" class="admin-editor hidden"><h2 id="editorTitle">Nouveau projet</h2><div class="admin-form-grid"><label>Nom *<input name="name" required maxlength="80"></label><label>Identifiant *<input name="id" required pattern="[a-z0-9-]+" maxlength="60"></label><label>Catégorie<select name="category"><option>Bots</option><option>Applications</option><option>Tools</option><option>Sites Web</option><option>Laboratoire</option></select></label><label>Statut<select name="status"><option>En développement</option><option>Disponible</option><option>Bientôt</option></select></label><label>Icône / emoji<input name="icon" maxlength="8"></label><label>Image du carrousel (URL)<input name="image" type="url"></label><label class="wide">Fichier APK Android (HEX-REC, JARVIS, HEX-APP ou HEXSONIC)<input name="apkFile" type="file" accept=".apk,application/vnd.android.package-archive"><small>Import direct dans le stockage privé Netlify. Taille maximale : 120 Mo.</small></label><label class="wide">Résumé *<textarea name="description" required maxlength="300"></textarea></label><label class="wide">Description détaillée<textarea name="details" rows="4" maxlength="3000"></textarea></label><label>Lien du projet<input name="link" type="url"></label><label>Lien de téléchargement<input name="download" type="url"></label><label class="wide">Fonctionnalités (une par ligne)<textarea name="features" rows="4"></textarea></label><label class="wide">Documentation / commandes (une par ligne)<textarea name="commands" rows="4"></textarea></label><label class="wide">Liens multiples (un par ligne : Nom | URL)<textarea name="links" rows="5" placeholder="Serveur 1 | https://exemple.com"></textarea></label><label class="wide">Prérequis (un par ligne)<textarea name="prerequisites" rows="3"></textarea></label><label class="wide">Exemples (un par ligne)<textarea name="examples" rows="3"></textarea></label><label class="checkline"><input type="checkbox" name="featured"> Mettre à la une</label></div><div class="admin-actions"><button class="btn btn-blue" type="submit">Enregistrer sur le site</button><button id="cancelEditor" class="btn btn-ghost" type="button">Annuler</button></div><p id="saveStatus" role="status"></p></form></section><section id="proposalsTab" class="hidden"><h2>Propositions de la communauté</h2><div id="proposalList" class="proposal-list"></div></section></section></main><script src="admin.js"></script></body></html>
