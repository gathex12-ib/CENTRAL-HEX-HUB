<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d19"><title>Proposer un projet — CENTRAL-HEX</title><link rel="icon" href="../assets/central-hex-icon.png"><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="proposer.css"></head><body class="dark"><header class="site-header"><a class="brand" href="/"><img src="../assets/central-hex-icon.png" class="brand-icon" alt=""><span>CENTRAL-HEX <small>HUB</small></span></a><a class="btn btn-ghost" href="/">← Retour au site</a></header><main class="proposal-page wrap"><span class="kicker">CENTRAL-HEX · ESPACE COMMUNAUTÉ</span><h1>Propose ton <em>projet.</em></h1><p class="intro">Présente ton idée à l'équipe. Décris le besoin, les fonctions envisagées et comment nous pouvons te contacter.</p><form id="proposalForm" class="proposal-form"><div class="form-grid"><label>Nom *<input name="nom" required maxlength="70"></label><label>Prénom *<input name="prenom" required maxlength="70"></label><label>Pays *<input name="pays" required maxlength="70"></label><label>WhatsApp *<input name="whatsapp" required inputmode="tel" maxlength="30" placeholder="+224 …"></label></div><label class="full-label">Nom du projet *<input name="titre" required maxlength="100"></label><label class="full-label">Description détaillée *<textarea name="description" required minlength="20" maxlength="5000" rows="7" placeholder="Quel problème ton projet résout-il ? Quelles fonctionnalités imagines-tu ?"></textarea></label><label class="consent"><input type="checkbox" name="consent" required><span>J'accepte que l'équipe CENTRAL-HEX utilise ces informations pour répondre à ma proposition.</span></label><button class="btn btn-blue submit-btn" type="submit">Envoyer ma proposition ↗</button><p id="proposalStatus" class="form-footnote" role="status">Les propositions sont enregistrées de manière privée. Aucun fichier n'est demandé dans cette version.</p></form></main><script src="proposer.js"></script></body></html>
